<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <title>Leons Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="index.css" rel="stylesheet">
    <script src="Types.js"></script>
    <script src="actions.js"></script>
    <script src="pre_game.js"></script>
    <script src="game.js"></script>
  </head>
  <body>
    <div id="pre_game">
      <h1>Lons Game</h1>
      <div>
        <input id="name_input" type="text" placeholder="Name">
      </div>
      <div>
        <h2>Units: </h2>
        <div id="units_select" class="units-select d-flex flex-wrap"></div>
      </div>
      <div>
        <input id="deck" type="text" placeholder="Deck" value="test">
      </div>
      <button class="btn btn-primary" type="button" onclick="ready_up()">Ready Up</button>
    </div>
    <div id="game" class="d-none d-flex">
      <div id="field" class="field">
        <div style="height: 10%">
          <h2 id="name">PLACEHOLDER</h2>
          <h3 id="lives">80</h3>
        </div>
        <div id="hand" class="w-100 d-flex flex-column overflow-hidden" style="height: 90%"></div>
      </div>
      <div class="flex-grow-1"></div>
      <div class="d-flex">
        <div class="d-flex flex-column">
          <div id="opp_units" class="units d-flex w-100 justify-content-center pb-3"></div>
          <button class="btn btn-danger w-25 align-self-center" onclick="sock.send('attack')" type="button" style="height: 5vh">Attack</button>
          <div id="units" class="units d-flex w-100 justify-content-center pt-3"></div>
        </div>
      </div>
      <div class="flex-grow-1"></div>
      <div id="opp_field" class="field">
        <div style="height: 10%">
          <h2 id="opp_name" class="text-end">PLACEHOLDER</h2>
          <h3 id="opp_lives" class="text-end">80</h3>
        </div>
        <div id="opp_hand" class="w-100 d-flex flex-column overflow-hidden align-items-end" style="height: 90%"></div>
      </div>
    </div>
    <input id="get_card" placeholder="Get ...">
    <button onclick="sock.send('get'); sock.send(document.getElementById('get_card').value)">Get Card</button>
  </body>
</html>

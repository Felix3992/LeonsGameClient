<!DOCTYPE html>
<html lang="en" class="w-100 h-100">
  <head>
    <meta charset="utf-8">
    <title>Leons Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="index.css" rel="stylesheet">
    <script src="dist/Types.js"></script>
    <script src="dist/actions.js"></script>
    <script src="dist/pre_game.js"></script>
    <script src="dist/game.js"></script>
  </head>
  <body class="w-100 h-100" onkeydown="if (event.key == 'AltGraph') {document.getElementById('debug').removeAttribute('hidden'); document.getElementById('get_card').select()}">
    <div id="pre_game" class="w-100 h-100 d-flex flex-column">
      <h1 class="align-self-center">Lons Game</h1>
      <div class="d-flex flex-1">
        <div class="w-25 d-flex flex-column justify-content-center">
          <div class="form-floating mb-2">
            <input id="name_input" class="form-control" type="text">
            <label for="name_input">Name</label>
          </div>
          <div class="form-floating mb-2">
            <select id="deck_select" class="form-select" onchange="update_selected_deck()"></select>
            <label for="deck_select">Deck</label>
          </div>
          <button id="ready_up_btn" class="btn btn-primary" type="button" onclick="ready_up()">Ready Up</button>
        </div>
        <div class="w-75 p-1">
          <div id="units_select" class="units-select w-100 d-flex flex-wrap justify-content-center gap-3 pb-3"></div>
          <div id="selected_deck" class="w-100 d-flex flex-wrap justify-content-center gap-2"></div>
        </div>
      </div>
    </div>
    <div id="game" class="d-none d-flex">
      <div id="field" class="field">
        <div style="height: 10%">
          <h2 id="name">PLACEHOLDER</h2>
          <h3 id="lives">80</h3>
        </div>
        <div id="hand" class="hand w-100 d-flex flex-column overflow-hidden"></div>
      </div>
      <div id="discard_pile" class="flex-1 d-flex flex-column align-items-center justify-content-center">
        <card-stack id="discard_pile_empty" class="empty-stack card w-75"></card-stack>
      </div>
      <div class="d-flex">
        <div class="d-flex flex-column">
          <div id="opp_units" class="units d-flex w-100 justify-content-center pb-3"></div>
          <div class="d-flex" align-self-center>
            <h2 id="rotation_number" class="flex-1 align-self-center mb-0">Rotation: 1</h2>
            <button id="attack_btn" class="btn btn-danger w-25 flex-1" onclick="sock.send('attack')" type="button">End turn</button>
            <div class="flex-1"></div>
          </div>
          <div id="units" class="units d-flex w-100 justify-content-center pt-3"></div>
        </div>
      </div>
      <div id="opp_discard_pile" class="flex-1 d-flex flex-column align-items-center justify-content-center">
        <card-stack id="opp_discard_pile_empty" class="empty-stack card w-75"></card-stack>
      </div>
      <div id="opp_field" class="field">
        <div style="height: 10%">
          <h2 id="opp_name" class="text-end">PLACEHOLDER</h2>
          <h3 id="opp_lives" class="text-end">80</h3>
        </div>
        <div id="opp_hand" class="hand w-100 d-flex flex-column overflow-hidden align-items-end"></div>
      </div>
    </div>
    <div id="overlays" class="w-100 h-100 position-absolute top-0" hidden>
      <div class="w-100 h-100 position-absolute top-0 bg-black opacity-75"></div>
      <div id="message-container" class="position-absolute w-100 h-100">
        <div class="position-relative w-100 h-100 justify-items-center align-content-end">
          <h1 id="message" class="text-center">Select 3 cards to discard</h1>
        </div>
      </div>
      <div id="roll-container" class="position-absolute w-100 h-100" hidden>
        <div class="dice-container position-relative">
          <div id="dice">20</div>
        </div>
      </div>
      <button id="cancel-action-btn" class="btn btn-danger position-relative align-self-center w-25" type="button" onclick="cancel_action()">Cancel</button>
    </div>
    <div id="debug" hidden>
      <input id="get_card" placeholder="Get ...">
      <button id="get_card_btn" onclick="sock.send('get'); sock.send(document.getElementById('get_card').value)">Get Card</button>
    </div>
    <card-stack id="stack-tooltip" class="position-absolute"></card-stack>
  </body>
</html>
